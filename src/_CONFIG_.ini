; Yaca configuration file
; GeneratedAt:
; UpdatedAt:
; Note: Do not edit this file manually. Use "yaca /cc" to modify it interactively.
;       Invalid format will make yaca refuse to run. Use "yaca /d" to repair it.
; https://github.com/Water-Run/yaca
;
; -----------------------------------------------------------------------------
; Value types (used in field comments below)
; -----------------------------------------------------------------------------
;   bool     : true | false  (case-sensitive)
;   int      : non-negative integer unless noted
;   float    : floating-point number
;   string   : quoted text, e.g. "FIFO" ; empty string is ""
;   false    : special scalar meaning "disabled / unlimited / use default"
;              (accepted only where a field comment says "or false")
;   regex    : Lua-compatible pattern string; "" disables the filter
;
; Layout (system first, models last for manual editing):
;   1. Network      - transport / proxy / TLS / retry
;   2. Exec         - local command execution limits
;   3. Permission.* - named safety profiles (first = default)
;   4. Context      - conversation storage, jump, compaction
;   5. Tui          - terminal UI behavior
;   6. Model.*      - provider entries (first = default; edit last)
;
; Naming:
;   - Section names use PascalCase.
;   - Named groups: [Permission.<Name>], [Model.<Name>].
;   - <Name>: non-empty, unique within its kind; letters/digits/underscore recommended.
;     Examples: Std, Cautious, TrustMeBro, Readonly, Deepseek.
; Default selection:
;   - Permission: the first [Permission.<Name>] section in file order is the default.
;   - Model:      the first [Model.<Name>] section in file order is the default.
;   - Reorder sections to change the default; no separate Active field.

; =============================================================================
; 1. Network — HTTP transport
; =============================================================================
; Keys:
;   FollowProxy   bool
;   UseStunnel    bool
;   MaxRetry      int >= 0 | false
;   RetryDelayMs  int >= 0 | false
; =============================================================================
[Network]
; --- transport ---
FollowProxy = true ; bool. true|false. Use system HTTP(S)_PROXY / proxy env. Default: true.
UseStunnel = true ; bool. true|false. Tunnel TLS via Stunnel when true. Default: true.
; --- retry ---
MaxRetry = 3 ; int >= 0, or false = do not retry. Max retries after a failed request. Default: 3.
RetryDelayMs = 1000 ; int >= 0 (ms), or false = no delay between retries. Default: 1000.

; =============================================================================
; 2. Exec — command execution limits
; Policy (allow/confirm/filters) lives under [Permission.*], not here.
; =============================================================================
; Keys:
;   TimeoutMs    int >= 0 | false
;   MaxOutputKB  int >= 0 | false
; =============================================================================
[Exec]
TimeoutMs = false ; int >= 0 (ms), or false = no timeout. Kills/stops capture after this time. Default: false.
MaxOutputKB = 1024 ; int >= 0 (KB), or false = unlimited. Max captured stdout/stderr size. Default: 1024.

; =============================================================================
; 3. Permission — named profiles (exactly four built-ins)
; -----------------------------------------------------------------------------
; [Permission.<Name>]  (<Name> user-defined, unique among Permission groups)
;   Description      string
;   Color            string   — TUI label color; one of the 16 standard colors (see below)
;   AllowWrite       bool     — may run file-modifying commands
;   AllowDelete      bool     — may run file-deleting commands
;   AllowNetwork     bool     — may run network-accessing commands
;   ConfirmWrite     bool     — ask before write  (only if AllowWrite=true)
;   ConfirmDelete    bool     — ask before delete (only if AllowDelete=true)
;   ConfirmNetwork   bool     — ask before net    (only if AllowNetwork=true)
;   DoubleCheck      bool     — call LLM to auto-review the action before running (slower)
;   AllowRegex       regex    — if non-empty, command must match to run
;   ExcludeRegex     regex    — if non-empty, matching commands are denied
;
; Color (16 standard terminal colors, case-insensitive names):
;   Black, Red, Green, Yellow, Blue, Magenta, Cyan, White,
;   BrightBlack, BrightRed, BrightGreen, BrightYellow,
;   BrightBlue, BrightMagenta, BrightCyan, BrightWhite
;
; Default: the first [Permission.<Name>] in this file (top to bottom) → Std.
; Runtime switch (e.g. .permission) may change session selection; file order
; is the startup / reset default. Reorder sections to pick another default.
;
; Evaluation order (conceptual):
;   1) ExcludeRegex deny  2) AllowRegex (if set)  3) Allow* capability
;   4) Confirm*  5) DoubleCheck (LLM auto-review when true; may block or re-prompt)
;
; Built-in four:
;   Std        — single confirmation (default)
;   Cautious   — same as Std, but DoubleCheck=true (LLM review / slower)
;   TrustMeBro — allow all, no confirmation
;   Readonly   — block write/delete/network
; =============================================================================

; --- Std: single confirmation (DEFAULT: first Permission section) ---
[Permission.Std]
Description = "Standard: allow write/delete/network with single confirmation" ; string. Human-readable label. May be empty.
Color = "Green" ; string enum (16 colors): Black|Red|Green|Yellow|Blue|Magenta|Cyan|White|BrightBlack|BrightRed|BrightGreen|BrightYellow|BrightBlue|BrightMagenta|BrightCyan|BrightWhite.
; capability
AllowWrite = true ; bool. true|false. Allow file-modifying commands.
AllowDelete = true ; bool. true|false. Allow file-deleting commands.
AllowNetwork = true ; bool. true|false. Allow network-accessing commands.
; confirmation (effective only when the matching Allow* is true)
ConfirmWrite = true ; bool. true|false. Prompt before write.
ConfirmDelete = true ; bool. true|false. Prompt before delete.
ConfirmNetwork = true ; bool. true|false. Prompt before network.
DoubleCheck = false ; bool. true|false. LLM auto-review of the pending action. Default (Std): false.
; command filters
AllowRegex = "" ; regex string. "" = no allow-list (all non-excluded allowed). Non-empty = must match.
ExcludeRegex = "" ; regex string. "" = disabled. Non-empty = matching commands denied.

; --- Cautious: Std + LLM double-check (slower) ---
[Permission.Cautious]
Description = "Cautious: same as Std with LLM double-check review (slower)" ; string. Human-readable label. May be empty.
Color = "Yellow" ; string enum (16 colors). See section header.
; capability
AllowWrite = true ; bool. true|false.
AllowDelete = true ; bool. true|false.
AllowNetwork = true ; bool. true|false.
; confirmation
ConfirmWrite = true ; bool. true|false.
ConfirmDelete = true ; bool. true|false.
ConfirmNetwork = true ; bool. true|false.
DoubleCheck = true ; bool. true|false. Call LLM to auto-review before running. Default (Cautious): true.
; command filters
AllowRegex = "" ; regex string. "" = no allow-list.
ExcludeRegex = "" ; regex string. "" = disabled.

; --- TrustMeBro: allow without confirmation ---
[Permission.TrustMeBro]
Description = "TrustMeBro: allow write/delete/network without confirmation" ; string. Human-readable label. May be empty.
Color = "Magenta" ; string enum (16 colors). See section header.
; capability
AllowWrite = true ; bool. true|false.
AllowDelete = true ; bool. true|false.
AllowNetwork = true ; bool. true|false.
; confirmation
ConfirmWrite = false ; bool. true|false.
ConfirmDelete = false ; bool. true|false.
ConfirmNetwork = false ; bool. true|false.
DoubleCheck = false ; bool. true|false. LLM auto-review. Default (TrustMeBro): false.
; command filters
AllowRegex = "" ; regex string. "" = no allow-list.
ExcludeRegex = "" ; regex string. "" = disabled.

; --- Readonly: block write / delete / network ---
[Permission.Readonly]
Description = "Readonly: block write/delete/network" ; string. Human-readable label. May be empty.
Color = "Cyan" ; string enum (16 colors). See section header.
; capability
AllowWrite = false ; bool. true|false. false blocks write regardless of ConfirmWrite.
AllowDelete = false ; bool. true|false. false blocks delete regardless of ConfirmDelete.
AllowNetwork = false ; bool. true|false. false blocks network regardless of ConfirmNetwork.
; confirmation (kept for schema consistency; blocked actions never run)
ConfirmWrite = true ; bool. true|false. Ignored while AllowWrite=false.
ConfirmDelete = true ; bool. true|false. Ignored while AllowDelete=false.
ConfirmNetwork = true ; bool. true|false. Ignored while AllowNetwork=false.
DoubleCheck = false ; bool. true|false. Ignored while Allow*=false.
; command filters
AllowRegex = "" ; regex string. "" = no allow-list.
ExcludeRegex = "" ; regex string. "" = disabled.

; =============================================================================
; 4. Context — conversation / memory
; =============================================================================
; Keys:
;   AutoJumpToDir      bool
;   AutoNameOnExit     bool
;   CompactThreshold   float in (0.0, 1.0] | false
; =============================================================================
[Context]
; --- behavior ---
AutoJumpToDir = true ; bool. true|false. If conversation root != CWD, chdir to it. Default: true.
AutoNameOnExit = false ; bool. true|false. Auto-name the current context when exiting the program. Default: false.
; --- compaction ---
CompactThreshold = 0.75 ; float in (0.0, 1.0], or false = never auto-compact.
;   Triggers compaction when context_tokens / model.ContextLength >= this ratio.
;   Example: 0.75 = compact at 75% of the active model's context window. Default: 0.75.

; =============================================================================
; 5. Tui — terminal UI
; =============================================================================
; Keys:
;   CheckModelOnStart              bool
;   CheckModelPerformanceOnStart   bool
;   DotCommandCompletion           bool
; =============================================================================
[Tui]
; --- startup checks ---
CheckModelOnStart = true ; bool. true|false. Ping connectivity of Enabled models on TUI enter. Default: true.
CheckModelPerformanceOnStart = false ; bool. true|false. Extra lightweight perf probe on enter. Default: false.
; --- interaction ---
DotCommandCompletion = true ; bool. true|false. Tab/hint completion for .quit .context .archive ... Default: true.

; =============================================================================
; 6. Model — providers (last; easiest to append / edit by hand)
; -----------------------------------------------------------------------------
; Form: [Model.<Name>]
;   <Name> user-defined, unique among Model groups (e.g. Deepseek, Poe, MyProxy).
;
; Keys (every Model section):
;   Enabled         bool              — listed for .model selection when true
;   Description     string            — human label; may be empty
;   Color           string            — TUI label color; one of the 16 standard colors
;   Style           "OpenAI" | "Anthropic"  — request/response API style
;   Name            string            — model id sent to the API; "" = unset
;   Url             string            — API base/endpoint URL; "" = not configured
;   Key             string            — API key / token; "" = not configured
;   ContextLength   int >= 1 | false  — context window in tokens; false = unknown
;   MaxTokens       int >= 1 | false  — max output tokens; false = provider default
;   TimeoutMs       int >= 0 | false  — request timeout (ms); false = no timeout
;   CustomPrompt    string            — extra system prompt; "" = disabled
;
; Color (same 16 as Permission):
;   Black, Red, Green, Yellow, Blue, Magenta, Cyan, White,
;   BrightBlack, BrightRed, BrightGreen, BrightYellow,
;   BrightBlue, BrightMagenta, BrightCyan, BrightWhite
;
; Style:
;   "OpenAI"     — OpenAI Chat Completions style (/v1/chat/completions, roles, tools)
;   "Anthropic"  — Anthropic Messages style (/v1/messages, system separate, etc.)
;
; Default: the first [Model.<Name>] in this file (top to bottom), regardless of
; Enabled. Runtime switch (e.g. .model) may change session selection; file order
; is the startup / reset default. Reorder sections to pick another default.
;
; A model is usable only when Enabled=true and Url/Key/Name are set as required
; by the provider. ContextLength feeds CompactThreshold ratio checks.
; =============================================================================

; --- DEFAULT model: first Model section ---
[Model.Deepseek]
; --- meta ---
Enabled = true ; bool. true|false. Selectable when true. Default (this entry): true.
Description = "DeepSeek API model" ; string. Display label. May be empty.
Color = "Blue" ; string enum (16 colors): Black|Red|Green|Yellow|Blue|Magenta|Cyan|White|BrightBlack|BrightRed|BrightGreen|BrightYellow|BrightBlue|BrightMagenta|BrightCyan|BrightWhite.
Style = "OpenAI" ; string enum: "OpenAI" | "Anthropic". API wire format. Default: "OpenAI".
; --- connection ---
Name = "deepseek-chat" ; string. Provider model id (e.g. "deepseek-chat"). "" = unset.
Url = "" ; string. HTTP(S) API endpoint. "" = not configured.
Key = "" ; string. API credential. "" = not configured. Treat as secret.
; --- limits ---
ContextLength = 128000 ; int >= 1 (tokens), or false = unknown/unlimited. Default: 128000.
MaxTokens = 8192 ; int >= 1 (tokens), or false = provider default. Default: 8192.
TimeoutMs = 60000 ; int >= 0 (ms), or false = no timeout. Default: 60000.
; --- prompt ---
CustomPrompt = "" ; string. Appended to system prompt. "" = disabled.

