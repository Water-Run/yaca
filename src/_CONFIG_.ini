```ini
; Yaca configuration file
; GeneratedAt:
; UpdatedAt:
; Note: Do not edit this file manually. Use "yaca /cc" to modify it interactively. Invalid format will make yaca refuse to run. Use "yaca /d" to repair it.
; https://github.com/Water-Run/yaca

[CONTEXT]
MaxSave = 20 ; Maximum total saved context count. false means unlimited.
MaxSizeMB = 128 ; Maximum total saved context size in MB. false means unlimited.
AutoSave = true ; Automatically save the current context.
RemoveStrategy = "FIFO" ; Context removal strategy: FIFO, LIFO, LARGEST, SMALLEST.

[MAIN-MODEL]
Url = "" ; Main model API endpoint. Empty means not configured.
Key = "" ; Main model API key. Empty means not configured.
Name = "gpt-5.5" ; Main model name.
TimeoutMs = 60000 ; Request timeout in milliseconds. false means no timeout.
MaxTokens = 8192 ; Maximum output tokens for one response. false means use provider default.
CustomPrompt = "" ; Extra prompt appended to the main model system prompt. Empty means disabled.
KnownHighPerformanceModelOnly = true ; Only allow known high-performance models as the main model.

[SIDE-MODEL]
Url = "" ; Side model API endpoint. Empty means not configured.
Key = "" ; Side model API key. Empty means not configured.
Name = "gemini-3.5-flash" ; Side model name.
TimeoutMs = 15000 ; Request timeout in milliseconds. false means no timeout.
MaxTokens = 2048 ; Maximum output tokens for one side-model response. false means use provider default.
CustomPrompt = "" ; Extra prompt appended to the side model system prompt. Empty means disabled.
CautiousLevel = 3 ; Side model caution level: 0 disabled, 1 loose, 2 normal, 3 cautious, 4 strict.

[EXEC]
TimeOut = false ; Command execution timeout in milliseconds. false means no timeout.
MaxOutputKB = 1024 ; Maximum captured command output size in KB. false means unlimited.
ExcludeRegex = "" ; Optional command deny regex. Empty means disabled.
AllowRegex = "" ; Optional command allow regex. Empty means allow all commands not blocked by ExcludeRegex.
ConfirmWrite = true ; Ask for confirmation before commands that may modify files.
ConfirmDelete = true ; Ask for confirmation before commands that may delete files.
ConfirmNetwork = true ; Ask for confirmation before commands that may access the network.

[NETWORK]
FollowProxy = true ; Follow system proxy settings.
MaxRetry = 3 ; Maximum retry count for failed network requests. false means no retry.
RetryDelayMs = 1000 ; Delay between retries in milliseconds. false means no delay.

[TUI]
CheckModelOnStart = true ; Check main model and side model connectivity when entering TUI.
CheckModelPerformanceOnStart = false ; Run a lightweight model performance check when entering TUI. false means disabled.
DotCommandCompletion = true ; Enable completion hints for dot commands, such as .quit, .context, .archive.
